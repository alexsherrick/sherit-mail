<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>mail · sign in</title>
<style>:root{--bg:#fff;--fg:#111;--line:#e6e6ea;--acc:#3b5bdb}@media(prefers-color-scheme:dark){:root{--bg:#121316;--fg:#ececf1;--line:#2a2c33;--acc:#7c93ff}}
body{margin:0;height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
form{display:grid;gap:10px;width:min(320px,90vw)}input,button{padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--bg);color:var(--fg)}button{background:var(--acc);color:#fff;border-color:var(--acc);cursor:pointer}.e{color:#c33;min-height:1.2em}</style></head>
<body><form id="f">
<a id="g" href="/auth/google" style="display:none;text-align:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;color:var(--fg);text-decoration:none;background:var(--bg)"><svg width="18" height="18" viewBox="0 0 48 48" style="vertical-align:-4px;margin-right:8px"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.6 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.3l7.8 6.1C12.3 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8C43.8 38 46.5 31.8 46.5 24.5z"/><path fill="#FBBC05" d="M10.4 28.6A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.1.8-4.6l-7.8-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.7l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.2 0 11.6-2 15.4-5.6l-7.5-5.8c-2 1.4-4.7 2.3-7.9 2.3-6.3 0-11.7-4.1-13.6-9.9l-7.8 6.1C6.5 42.6 14.6 48 24 48z"/></svg>Sign in with Google</a>
<div id="pwbox" style="display:none"><input type="password" id="p" placeholder="Password" autocomplete="current-password"><button>Sign in</button></div><div class="e" id="e"></div></form>
<script>if('__GOOGLE__'==='1'){document.getElementById('g').style.display='block'}if('__PASSWORD__'==='1'){document.getElementById('pwbox').style.display='contents';document.getElementById('p').focus()}
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const r=await fetch('/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:document.getElementById('p').value})});if(r.ok)location.reload();else document.getElementById('e').textContent='Wrong password'}</script></body></html>
