.nav a.on{background:color-mix(in oklab,var(--acc) 15%,var(--side));color:var(--fg)}.nav a.on .n{color:var(--fg)}.nav a.on .i{color:var(--acc)}
.nav a .dot{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex:none;background:color-mix(in oklab,var(--c,var(--acc)) 18%,var(--side));color:color-mix(in oklab,var(--c,var(--acc)) 50%,var(--fg));background:oklch(from var(--c,var(--acc)) .94 min(c,.035) h);color:oklch(from var(--c,var(--acc)) .47 min(c,.12) h)}.nav a .dot.biz{border-radius:5px}

/* The arrow on Unread and the folders that lists each account under it; a finger gets a wider target. After

   Above the list, the account chip's × goes back to all. */
.nav a .exp{margin:-4px -6px -4px auto;display:inline-flex;align-items:center;justify-content:center;width:28px;height:24px;border-radius:6px;color:var(--mut);flex:none}.nav a .exp:hover{background:var(--hover)}.nav a .n+.exp{margin-left:2px}
/* With a pointer the arrows show on the row under it, and on an open list; More's always. A finger sees them all. */

  /* Unread's hidden arrow kept its count short of the others' column: the arrow now sits over the count and takes its place on hover. */
  .nav a{position:relative}.nav a .n+.exp:not(.open){position:absolute;right:4px;top:calc(50% - 12px);margin:0}.nav a:hover .n:has(+.exp:not(.open)){opacity:0}}

/* rows: two lines by default (sender · date / subject / snippet); one line when the list column is wide enough */

   their text. The rows do not take the prefix: WebKit paints no:highlight in unselectable text, which blanked ⌘F's marks in the list
   (findbar.py). The list refuses text selection in app.js instead (#threads selectstart); headings and the sidebar take the prefix.
    */
.t{position:relative;display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:1px 10px;padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer;background:var(--bg);touch-action:pan-y;user-select:none;align-items:center}

   an estimate moved the list under my eyes. Where it is used the estimate is exact: --rowh is measured from a real

  @media(hover:none){.app.viewing~.toast,.app.viewing~.ask{bottom:calc(70px + var(--sb))}}

  .reply{position:fixed;left:0;right:0;bottom:0;z-index:14;padding:10px 12px calc(10px + var(--sb));border-radius:16px 16px 0 0;box-shadow:0 -10px 34px rgba(0,0,0,.35);max-height:82vh;overflow-y:auto}.reply textarea{min-height:110px}#rclose{display:inline-flex;padding:4px 6px}
  .modal{padding:0;align-items:stretch}.card{width:100%;max-height:none;height:100%;border-radius:0;padding:14px}
  .t{padding:10px 12px}
}
