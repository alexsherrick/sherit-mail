# RETIRED 2026-11-15: the Worker, its Shrinker Durable Object namespace, its container application and images are
# deleted in Cloudflare. Do not deploy this. The folder stays because the tests take sharp from container/node_modules; the picture
# shrinker is hub/img/.
# mailhub-shrink: shrinks the mail hub's big stored pictures with sharp in a Cloudflare Container, every 15 minutes and
# only while pictures wait. No public URL. Deploy from this folder through bin/harness_release.py, like the hub.
name = "mailhub-shrink"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

[triggers]
crons = ["*/15 * * * *"]

# Logs kept 7 days in this account, so a failed run's error can be read afterwards: the 20:15 UTC run on 2026-10-15 threw before the
# container started and nothing recorded why. ~300 events a day against 20 million included a month (Workers Logs pricing).
[observability]
enabled = true
head_sampling_rate = 1

[[containers]]
class_name = "Shrinker"
image = "./container/Dockerfile"
instance_type = "basic"   # 1/4 vCPU, 1 GiB, 4 GB: sharp peaked at 95-162 MB on the Mac
max_instances = 1

[[durable_objects.bindings]]
name = "SHRINKER"
class_name = "Shrinker"

[exports.Shrinker]
type = "durable-object"
storage = "sqlite"

[[d1_databases]]
binding = "DB"
database_name = "mailhub"
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "STORE"
bucket_name = "mailhub-store"
